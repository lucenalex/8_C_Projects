name: Windows CodeBlocks project build validation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-codeblocks.yml'
      - 'tools/validate_codeblocks_projects.py'
      - '**/*.cbp'
      - '**/*.c'
      - '**/*.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-codeblocks-projects:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout source without storing credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up UCRT64 GCC and Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build .cbp project sources in temporary directory
        shell: msys2 {0}
        run: |
          gcc --version | head -1
          python --version
          python tools/validate_codeblocks_projects.py --report "$RUNNER_TEMP/codeblocks-windows/results.json"
      - name: Upload CodeBlocks linker diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeblocks-ucrt64-build-results
          path: ${{ runner.temp }}/codeblocks-windows/
          if-no-files-found: warn
          retention-days: 7
