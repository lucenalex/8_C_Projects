name: Apply guarded byte-preserving maintenance
on:
  push:
    branches: [maintenance/legacy-warnings-2026-11-02]
    paths:
      - .github/workflows/apply-legacy-maintenance.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository_owner == 'lucenalex'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact maintenance branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply vetted ASCII byte-level fix
        run: |
          python3 tools/fix_scansets_bytes.py
          python3 tools/fix_scansets_bytes.py --apply
      - name: Validate corrected source
        run: |
          gcc -std=c11 -Wall -Wextra -Wpedantic -fsyntax-only EDB_SL2_Desafio_1/main.c
          git diff --check
          changed=$(git diff --name-only | wc -l)
          test "$changed" -eq 1
          git diff --name-only
      - name: Commit only source modifications on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'EDB_SL2_Desafio_1/main.c'
          git diff --cached --quiet && exit 1
          git commit -m 'style: correct diagnosed warnings without decoding source'
          git push origin HEAD:maintenance/legacy-warnings-2026-11-02
